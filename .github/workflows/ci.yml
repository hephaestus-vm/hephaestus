name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref — cheap macOS-runner hygiene.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Decide whether the expensive macOS build/test jobs are relevant to this
  # change. Docs-only PRs skip them; the cheap ubuntu jobs always run. Pushes
  # to main always run everything — main is the release baseline and primes
  # the rust-cache entries PR runs restore from. Job-level gating (rather
  # than workflow `paths-ignore`) keeps every check reporting a status, so
  # this stays correct if branch protection ever marks them required.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    outputs:
      # `true || …` short-circuits for push events, where the filter step is
      # skipped and its output is empty.
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Everything that can change what the macOS jobs compile, lint,
          # test, or exercise. Markdown and non-CI dotfiles are the point of
          # the skip; when in doubt a path belongs on this list.
          filters: |
            code:
              - 'src/**'
              - 'swift/**'
              - 'compat/**'
              - 'guest/**'
              - 'scripts/**'
              - 'vendor/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'justfile'
              - 'version.txt'
              - '*.entitlements'
              - '.github/workflows/**'

  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate squash-merge title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-pr-title.py "$PR_TITLE"

  version:
    name: product version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: scripts/check-product-version.sh

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check-doc-links.py

  script-tooling:
    name: shell and Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          shellcheck \
            scripts/package-vmnet-app.sh \
            scripts/fc-compat-net-e2e.sh \
            scripts/fc-compat-vsock-e2e.sh \
            scripts/net-isolation-e2e.sh \
            scripts/generate-fc-sandbox-profile.sh
      - run: python3 -m compileall -q scripts
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  installer:
    name: installer interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck install.sh scripts/test-installer.sh
      - run: scripts/test-installer.sh

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Apple's containerization 0.30.1 requires swift-tools-version 6.2, which
      # ships in Xcode 26+. macos-15 runners default to Xcode 16 (Swift 6.1).
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # rust-toolchain.toml pins channel = "1.96", which rustup resolves to a
      # different toolchain alias than whatever stable patch the action installs.
      # Install components against that exact alias so cargo fmt/clippy work.
      - run: rustup toolchain install 1.96 --component rustfmt --component clippy --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace

  swift-build:
    name: swift build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # build.rs in hephaestus-bridge runs `xcrun swift build` as part
      # of cargo build; a successful cargo build means swift built too.
      - run: cargo build --workspace

  fc-compat-config:
    name: Firecracker API config-only compat
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: compat/firectl-harness/go.mod
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/fc-compat-config-only.sh

  fc-compat-sandbox-config:
    name: Firecracker API restrictive sandbox compat
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: compat/firectl-harness/go.mod
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: scripts/fc-compat-sandbox-config.sh
